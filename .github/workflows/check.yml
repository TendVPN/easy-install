name: Check installer
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sh -n install.sh tendvpn
      - run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - run: ./tendvpn plan --output .preview
      - run: docker compose --project-directory .preview -f .preview/compose.json config --quiet
